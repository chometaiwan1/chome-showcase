      <div class="sidebar-metrics">

        <div><span>出庫</span><strong id="metricOut">0</strong></div>

    <main class="workspace">
      <header class="topbar">
        <div>
          <p class="eyebrow">Internal Google Sign-In</p>
          <h1>晶鑫倉庫管理</h1>
        </div>
        <button id="refreshButton" type="button">重新整理</button>
      </header>

      <section class="view" id="view-operate">
        <div class="scanner-panel">
          <div class="scan-box">
            <video id="scannerVideo" playsinline muted></video>
            <div class="scan-frame"></div>
            <div class="scan-placeholder">輸入或掃描單件物品編號</div>
          </div>
          <div class="scan-controls">
            <label for="itemSearch">物品編號 / 品名</label>
            <div class="input-row">
              <input id="itemSearch" type="search" placeholder="JX-CUS-001-001、抱枕、LED">
              <button id="scanButton" type="button">掃碼</button>
            </div>
            <div class="quick-list" id="quickList"></div>
          </div>
        </div>

        <div class="operation-grid">
          <section class="detail-panel">
            <div class="section-title"><span>目前物品</span><strong id="selectedItemId">尚未選取</strong></div>
            <figure class="item-photo" id="selectedPhotoWrap">
              <img id="selectedPhoto" alt="物品照片">
              <figcaption>
                <span id="selectedPhotoCaption">物品照片</span>
                <a id="selectedPhotoLink" href="#" target="_blank" rel="noopener">開啟圖片</a>
              </figcaption>
            </figure>
            <dl class="item-facts">
              <div><dt>品名</dt><dd id="selectedName">-</dd></div>
              <div><dt>規格</dt><dd id="selectedSpec">-</dd></div>
              <div><dt>狀態</dt><dd id="selectedStatus">-</dd></div>
              <div><dt>總數量</dt><dd id="selectedAmount">-</dd></div>
              <div><dt>同品項位置分布</dt><dd id="selectedDistribution">-</dd></div>
              <div><dt>品項</dt><dd id="selectedType">-</dd></div>
              <div><dt>最近異動</dt><dd id="selectedMovedAt">-</dd></div>
            </dl>
          </section>

          <section class="action-panel">
            <div class="section-title"><span>快速異動</span><strong id="actionTarget">未選取</strong></div>
            <form id="movementForm">
              <label for="actionType">動作</label>
              <select id="actionType" required>
                <option value="出庫">出庫</option>
                <option value="入庫">入庫</option>
                <option value="調撥">調撥</option>
                <option value="維修">維修</option>
                <option value="報廢">報廢</option>
                <option value="盤點">盤點</option>
              </select>
              <label class="source-location-field" for="fromLocation">來源位置</label>
              <select class="source-location-field" id="fromLocation" required>
                <option value="">請先選取物品</option>
              </select>
              <label for="toLocation">目的地 / 新位置</label>
              <select id="toLocation" required>
                <option value="公司倉庫">公司倉庫</option>
                <option value="暫存區">暫存區</option>
                <option value="房源 / 案場">房源 / 案場</option>
                <option value="維修商">維修商</option>
                <option value="報廢區">報廢區</option>
                <option value="其他位置">其他位置</option>
              </select>
              <select class="property-location" id="propertyLocation">
                <option value="">選擇房源 / 案場</option>
              </select>
              <input class="custom-location" id="customLocation" type="text" placeholder="輸入實際位置，例如：中山區 XX 物件">
              <label for="movementQuantity">異動數量</label>
              <input id="movementQuantity" type="number" min="1" step="1" value="1" required>
              <label for="operatorName">操作人</label>
              <input id="operatorName" type="text" value="<?= userEmail ?>" readonly required>
              <label for="movementNote">備註</label>
              <textarea id="movementNote" rows="3" placeholder="用途、損壞情況、補充說明"></textarea>
              <button class="primary-action" type="submit">新增異動紀錄</button>
            </form>
          </section>
        </div>

        <section class="history-strip">
          <div class="section-title"><span>此物品紀錄</span><strong id="selectedHistoryCount">0 筆</strong></div>
          <div class="movement-list compact" id="selectedHistory"></div>
        </section>
      </section>

      <section class="view active" id="view-inventory">
        <div class="inventory-heading">
          <strong>庫存瀏覽</strong>
          <button class="filter-toggle" id="filterToggle" type="button" aria-expanded="false">篩選</button>
          <label class="catalog-select">
            <span>商品排序</span>
            <select id="sortSelect">
              <option value="category">類別排序</option>
              <option value="name">品名排序</option>
              <option value="status">狀態排序</option>
              <option value="recent">最近異動</option>
            </select>
          </label>
          <label class="catalog-select">
            <span>每頁顯示</span>
            <select id="pageSizeSelect">
              <option value="24">24 個</option>
              <option value="48">48 個</option>
              <option value="96">96 個</option>
            </select>
          </label>
          <span id="inventoryCount">0 件物品</span>
        </div>
        <div class="filter-panel" id="filterPanel">
          <input id="inventoryFilter" type="search" placeholder="搜尋類別、品名、規格、位置">
          <select id="categoryFilter"><option value="">全部類別</option></select>
          <select id="statusFilter">
            <option value="">全部狀態</option>
            <option value="良好">良好</option>
            <option value="在庫">在庫</option>
            <option value="已出庫">已出庫</option>
            <option value="維修中">維修中</option>
            <option value="報廢">報廢</option>
          </select>
          <select id="locationFilter"><option value="">全部位置</option></select>
          <button id="clearFilters" type="button">清除篩選</button>
        </div>
        <div class="product-grid" id="inventoryGrid"></div>
        <div class="pager" id="inventoryPager"></div>
        <div class="table-wrap inventory-table-fallback">
          <table>
            <thead><tr><th>單件編號</th><th>類別</th><th>品名</th><th>規格</th><th>狀態</th><th>位置</th></tr></thead>
            <tbody id="inventoryTable"></tbody>
          </table>
        </div>
      </section>

      <section class="view" id="view-history">
        <div class="toolbar"><input id="historyFilter" type="search" placeholder="搜尋物品、動作、地點、操作人"></div>
        <div class="movement-list" id="movementList"></div>
      </section>
    </main>
  </div>
  <div class="toast" id="toast"></div>
